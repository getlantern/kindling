name: site

# Deploys site/ to the Cloudflare Pages project "kindling" on every push to main
# that touches it.
#
# Required repository secrets:
#   - CLOUDFLARE_API_TOKEN  - scoped to "Account.Cloudflare Pages: Edit"
#                             on account 1c693b3f1031ed33f68653b1e67dfbef
#   - CLOUDFLARE_ACCOUNT_ID - 1c693b3f1031ed33f68653b1e67dfbef

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # First run only: create the project. It fails once the project exists.
      - name: create Pages project if missing
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create kindling --production-branch main
      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name kindling --branch main
